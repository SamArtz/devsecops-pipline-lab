name: DevSecOps Pipeline — End to End

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-analysis:
    name: Análisis Estático (CodeQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - uses: github/codeql-action/analyze@v3

  gitleaks-scan:
    name: Detección de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    name: Escaneo de Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: codeql-analysis

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-report.sarif'
          severity: 'CRITICAL,HIGH'

  generate-sbom:
    name: Generación de SBOM
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - uses: actions/checkout@v4

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.cyclonedx.json

  security-gate:
    name: Política de Seguridad (Quality Gate)
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - gitleaks-scan

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  sonarqube-scan:
    name: Análisis de Calidad (SonarQube)
    runs-on: ubuntu-latest
    needs: security-gate

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar pruebas y generar cobertura
        run: |
          npm install
          npm test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  terraform-deploy:
    name: Despliegue de Infraestructura (Terraform)
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: ./infra

      - run: terraform apply -auto-approve -var="bucket_name=${{ secrets.BUCKET_NAME }}"
        working-directory: ./infra

  terraform-destroy:
    name: Destruir Infraestructura (Limpieza manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: ./infra

      - run: terraform destroy -auto-approve -var="bucket_name=${{ secrets.BUCKET_NAME }}"
        working-directory: ./infra