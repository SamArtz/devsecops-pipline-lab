apiVersion: batch/v1
kind: Job
metadata:
  name: order-producer
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: order-producer
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-producer
          image: devsecops-lab/k8s-app:1.0
          imagePullPolicy: IfNotPresent
          command: [node, kafka-producer.js]
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
